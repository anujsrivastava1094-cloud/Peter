name: PETER Guardian
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian:
    name: Static bug firewall
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run PETER Guardian
        run: node peter-guardian.js
      - name: Save diagnostic report
        if: always()
        run: node peter-guardian.js > guardian-report.txt 2>&1 || true
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: peter-guardian-report-${{ github.sha }}
          path: guardian-report.txt
          retention-days: 7
